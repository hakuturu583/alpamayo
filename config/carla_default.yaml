# CARLA simulation pipeline – default configuration
# All values match the dataclass defaults in carla/config.py.
# Override only the keys you want to change in a derived file.

camera:
  width: 1920
  height: 1080
  height_offset: 1.5            # z above vehicle actor origin [m]
  cross_lateral_offset: 1.2     # |y| for side cameras [m]
  front_longitudinal_offset: 2.0  # x for front cameras [m]
  front_wide_fov: 120.0         # front wide-angle FOV [deg]
  cross_fov: 120.0              # side cross-camera FOV [deg]
  front_tele_fov: 30.0          # front telephoto FOV [deg]

control:
  max_speed: 15.0               # hard speed cap [m/s]  (~54 km/h)
  lateral_lookahead: 15.0       # fixed lateral lookahead distance [m]
  min_lookahead_distance: 4.5   # minimum lookahead distance [m]
  spline_num_points: 200
  speed_limit_factor: 0.8       # fraction of road speed limit to target
  max_lateral_accel: 4.0        # max lateral accel for curve speed limit [m/s²]
  throttle_gain: 0.5            # P-gain: speed error → throttle
  brake_threshold: -0.5         # speed error [m/s] to engage braking
  brake_value: 0.3              # normalised brake command
  speed_reduction_threshold: 0.75  # trajectory-length ratio to start slowing
  min_speed_factor: 0.1         # lower bound on speed reduction multiplier
  rear_axle_offset: 0.5         # rear bumper → rear axle estimate [m]

inference:
  top_p: 0.98
  temperature: 0.6
  num_traj_samples: 1
  max_generation_length: 256
  num_frame_history: 4          # rolling camera frames kept per camera
  control_frequency: 10.0       # inference / control update rate [Hz]

simulation:
  host: "localhost"
  port: 2000
  timeout: 10.0                 # CARLA client timeout [s]
  delta_seconds: 0.05           # fixed simulation timestep (20 Hz)
  map_name: "Town01"
  num_vehicles: 50
  num_pedestrians: 30
  num_steps: 2000
  spawn_point_index: 0
  seed: 0
  vehicle_model: "vehicle.tesla.model3"
  traffic_manager_port: 8000
  min_vehicle_distance: 20.0    # min spawn distance from ego [m]
  pedestrian_spawn_radius: 60.0
  pedestrian_speed_min: 1.0     # [m/s]
  pedestrian_speed_max: 2.0     # [m/s]

video:
  save_video: true
  frames_per_segment: 100
  fps: 20.0
